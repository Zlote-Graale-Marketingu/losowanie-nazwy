<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turniej Nazw</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #0056b3; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .match-box { display: flex; gap: 10px; margin-top: 15px; }
    .option-btn { flex: 1; padding: 20px; font-size: 18px; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- FORMULARZ DLA ZGŁASZAJĄCYCH -->
  <div id="form-section" class="card">
    <h2>Dodaj swoje propozycje</h2>
    <input type="text" id="user" placeholder="Imię i Nazwisko" required>
    <input type="text" id="name1" placeholder="Pierwsza nazwa" required>
    <input type="text" id="name2" placeholder="Druga nazwa" required>
    <button onclick="submitNames()">Wyślij zgłoszenie</button>
    <p id="msg"></p>
    <hr>
    <button onclick="showAdmin()" class="btn-secondary">Panel Prowadzącego (Losowanie)</button>
  </div>

  <!-- PANEL LOGOWANIA DLA PROWADZĄCEGO -->
  <div id="admin-login" class="card hidden">
    <h2>Uruchomienie Turnieju</h2>
    <input type="password" id="password" placeholder="Podaj hasło">
    <button onclick="startTournament()">Rozpocznij Losowanie</button>
    <button onclick="hideAdmin()" class="btn-secondary">← Powrót do dodawania nazw</button>
  </div>

  <!-- EKRAN TURNIEJU -->
  <div id="tournament-section" class="card hidden">
    <h2 id="round-title">Runda</h2>
    <p>Kliknij nazwę, która wygrywa pojedynek:</p>
    <div class="match-box">
      <button id="btn1" class="option-btn" onclick="selectWinner(0)"></button>
      <button id="btn2" class="option-btn" onclick="selectWinner(1)"></button>
    </div>
  </div>

  <!-- WYNIK FINALNY -->
  <div id="winner-section" class="card hidden" style="text-align: center;">
    <h2>🏆 Zwycięska Nazwa 🏆</h2>
    <h1 id="winner-name" style="color: #28a745;"></h1>
  </div>

  <script>
    const SUPABASE_URL = "https://skgblorvvqlahzvbpqps.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrZ2Jsb3J2dnFsYWh6dmJwcXBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc5OTA0MzE0MzM5OTAsImV4cCI6MjA1MzU2MDQzMX0.zrnC8JgN_N7AphLnti7UjkDwVY6";
    const ADMIN_PASSWORD = "skarpetka"; 

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMatches = [];
    let currentMatchIndex = 0;
    let nextRoundWinners = [];
    let roundNumber = 1;

    async function submitNames() {
      const user = document.getElementById('user').value.trim();
      const name1 = document.getElementById('name1').value.trim();
      const name2 = document.getElementById('name2').value.trim();

      if(!user || !name1 || !name2) return alert("Wypełnij wszystkie pola!");

      const { error } = await db.from('items').insert([
        { author: user, title: name1 },
        { author: user, title: name2 }
      ]);

      if (error) {
        alert("Błąd zapisu: " + error.message);
      } else {
        document.getElementById('msg').innerText = "Zgłoszenie zostało zapisane!";
        document.getElementById('user').value = '';
        document.getElementById('name1').value = '';
        document.getElementById('name2').value = '';
      }
    }

    function showAdmin() {
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('admin-login').classList.remove('hidden');
    }

    function hideAdmin() {
      document.getElementById('admin-login').classList.add('hidden');
      document.getElementById('form-section').classList.remove('hidden');
    }

    async function startTournament() {
      const pwd = document.getElementById('password').value;
      if (pwd !== ADMIN_PASSWORD) return alert("Błędne hasło!");

      const { data, error } = await db.from('items').select('*');
      if (error || !data || data.length < 2) return alert("Za mało nazw w bazie (wymagane minimum 2)!");

      const preparedList = pairInitialItems(data);
      currentMatches = preparedList;

      // Całkowite ukrycie formularzy dodawania i logowania
      document.getElementById('form-section').remove();
      document.getElementById('admin-login').remove();
      
      document.getElementById('tournament-section').classList.remove('hidden');
      renderMatch();
    }

    function pairInitialItems(items) {
      let shuffled = [...items].sort(() => Math.random() - 0.5);
      let pairs = [];
      
      while (shuffled.length > 1) {
        let itemA = shuffled.shift();
        let indexB = shuffled.findIndex(item => item.author !== itemA.author);

        if (indexB !== -1) {
          let itemB = shuffled.splice(indexB, 1)[0];
          pairs.push([itemA, itemB]);
        } else {
          let itemB = shuffled.shift();
          pairs.push([itemA, itemB]);
        }
      }

      if (shuffled.length === 1) {
        pairs.push([shuffled[0], { title: "Wolny Los (Automatyczny awans)", isBye: true }]);
      }

      return pairs;
    }

    function renderMatch() {
      if (currentMatchIndex >= currentMatches.length) {
        if (nextRoundWinners.length === 1) {
          showFinalWinner(nextRoundWinners[0].title);
          return;
        }
        
        roundNumber++;
        currentMatches = createNextRoundPairs(nextRoundWinners);
        nextRoundWinners = [];
        currentMatchIndex = 0;
      }

      document.getElementById('round-title').innerText = `Runda ${roundNumber} - Pojedynek ${currentMatchIndex + 1}/${currentMatches.length}`;
      
      const pair = currentMatches[currentMatchIndex];
      
      if (pair[1].isBye) {
        nextRoundWinners.push(pair[0]);
        currentMatchIndex++;
        renderMatch();
        return;
      }

      document.getElementById('btn1').innerText = pair[0].title;
      document.getElementById('btn2').innerText = pair[1].title;
    }

    function selectWinner(index) {
      const winner = currentMatches[currentMatchIndex][index];
      nextRoundWinners.push(winner);
      currentMatchIndex++;
      renderMatch();
    }

    function createNextRoundPairs(winners) {
      let shuffled = [...winners].sort(() => Math.random() - 0.5);
      let pairs = [];

      while (shuffled.length > 1) {
        pairs.push([shuffled.shift(), shuffled.shift()]);
      }
      if (shuffled.length === 1) {
        pairs.push([shuffled[0], { title: "Wolny Los (Automatyczny awans)", isBye: true }]);
      }
      return pairs;
    }

    function showFinalWinner(title) {
      document.getElementById('tournament-section').classList.add('hidden');
      document.getElementById('winner-section').classList.remove('hidden');
      document.getElementById('winner-name').innerText = title;
    }
  </script>
</body>
</html>
